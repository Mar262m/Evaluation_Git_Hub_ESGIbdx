<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon — Association étudiante</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="inscription.css">
</head>
<body>

    <!-- ===== En-tête et navigation ===== -->
    <header class="header">
        <div class="container header-inner">
            <a href="#accueil" class="logo">Horizon</a>
        </div>
    </header>

    <main>

        <!-- ===== Accueil ===== -->
        <section id="accueil" class="hero">
            <div class="container">
                <h1>Horizon — Association étudiante</h1>
            </div>
        </section>

        <!-- ===== À propos ===== -->
        <section id="a-propos" class="section">
            <div class="container">
                <h2>Qui sommes-nous ?</h2>
            </div>
        </section>

        <!-- ===== Événements (Fonctionnalité B - étudiant 2) ===== -->
        <section id="evenements" class="section">
            <div class="container">
                <h2>Événements à venir</h2>
                <!-- Le catalogue d'événements sera ajouté ici -->
            </div>
        </section>

        <!-- ===== Inscription (Fonctionnalité C - étudiant 3) ===== -->
        <section id="inscription" class="section">
            <div class="container">
                <h2>Inscrivez-vous à un événement</h2>
                <p class="inscription-intro">
                    Renseignez vos coordonnées pour vous inscrire.
                    Les champs marqués d'une étoile (*) sont obligatoires.
                </p>

                <form id="inscription-form" class="inscription-form" novalidate>

                    <div class="form-group">
                        <label for="nom">Nom *</label>
                        <input type="text" id="nom" name="nom" autocomplete="family-name" required>
                    </div>

                    <div class="form-group">
                        <label for="prenom">Prénom *</label>
                        <input type="text" id="prenom" name="prenom" autocomplete="given-name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Adresse email *</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="evenement">Événement *</label>
                        <!-- Un seul événement sélectionnable. L'option vide par défaut
                             représente « aucun événement choisi » (champ obligatoire).
                             Les intitulés sont ceux du catalogue d'événements
                             (Fonctionnalité B) : à garder alignés avec lui. -->
                        <select id="evenement" name="evenement" required>
                            <option value="" selected>— Choisissez un événement —</option>
                            <option value="atelier-initiation-code">Atelier d'initiation au code</option>
                            <option value="soiree-jeux-societe">Soirée jeux de société</option>
                            <option value="conference-numerique-responsable">Conférence sur le numérique responsable</option>
                        </select>
                    </div>

                    <button type="submit" class="form-submit">S'inscrire</button>

                </form>
            </div>
        </section>

    </main>

    <!-- ===== Pied de page ===== -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Horizon — Association étudiante</p>
        </div>
    </footer>

</body>
</html>
